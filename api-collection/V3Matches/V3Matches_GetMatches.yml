http:
  method: GET
  url: "{{baseUrl}}/api/v3/organizations/:orgId/leagues/:leagueId/matches"
  params:
    - name: orgId
      value: 11111111-1111-1111-1111-111111111111
      type: path
    - name: leagueId
      value: 22222222-2222-2222-2222-222222222222
      type: path
    - name: seasonId
      value: ""
      type: query
      disabled: true
    - name: leaguePlayerId
      value: ""
      type: query
      disabled: true
    - name: limit
      value: "50"
      type: query
    - name: offset
      value: "0"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

