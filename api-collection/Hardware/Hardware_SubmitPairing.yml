info:
  name: Hardware_SubmitPairing
  type: http
  seq: 3
  tags:
    - Hardware

http:
  method: POST
  url: "{{baseUrl}}/api/v3/hardware/pairing"
  body:
    type: json
    data: |-
      {
        "rfidUid": "",
        "colors": ["Red", "Green", "Blue", "Yellow"]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

