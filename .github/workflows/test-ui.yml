name: UI - build and test

# Pull requests always run this workflow so its check reports and can be
# required; the `changes` job decides whether the suite runs.
on:
  push:
    branches: ["main"]
    paths:
      - "frontend/**/*"
      - ".nvmrc"
      - ".github/workflows/test-ui.yml"
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=true
          # Pushes are already scoped by `paths`.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # --no-renames also lists a moved file's old path, and -z stops git
            # quoting unusual names, which the anchors would then miss.
            files="$RUNNER_TEMP/changed-files"
            git diff --name-only -z --no-renames "$BASE_SHA"..."$HEAD_SHA" > "$files"
            # Only "no match" may skip the suite; a grep error must not.
            rc=0
            grep -qzE '^(frontend/|\.nvmrc$|\.github/workflows/test-ui\.yml$)' "$files" || rc=$?
            if [ "$rc" -eq 1 ]; then changed=false; fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  build:
    name: UI
    needs: changes
    # A skipped job passes as a required check, so only an explicit "nothing
    # changed" may skip the suite; a failed detection still runs it.
    if: ${{ !cancelled() && needs.changes.outputs.changed != 'false' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          node-version-file: .nvmrc
      - name: Install
        run: npm ci
        working-directory: ./frontend
      - name: Lint
        run: npm run lint
        working-directory: ./frontend
      - name: Unit Test
        run: npm run test
        working-directory: ./frontend
      - name: Build
        run: npm run build
        working-directory: ./frontend
        env:
          PUBLIC_CLERK_PUBLISHABLE_KEY: ""
      - name: Svelte Check
        run: npm run check
        working-directory: ./frontend
        env:
          PUBLIC_CLERK_PUBLISHABLE_KEY: ""
