name: UI - build and test

# Pull requests always run this workflow so its check reports and can be
# required; the `changes` job decides whether the suite runs.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/test-ui.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=true
          # Pushes are already scoped by `paths`.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # --no-renames also lists a moved file's old path, and -z stops git
            # quoting unusual names, which the anchors would then miss.
            files="$RUNNER_TEMP/changed-files"
            git diff --name-only -z --no-renames "$BASE_SHA"..."$HEAD_SHA" > "$files"
            # Only "no match" may skip the suite; a grep error must not.
            rc=0
            grep -qzE '^(frontend/|\.github/workflows/test-ui\.yml$)' "$files" || rc=$?
            if [ "$rc" -eq 1 ]; then changed=false; fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  build:
    name: UI
    needs: changes
    # A skipped job passes as a required check, so only an explicit "nothing
    # changed" may skip the suite; a failed detection still runs it.
    if: ${{ !cancelled() && needs.changes.outputs.changed != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # The app pins its own Node major so CI tests the runtime its image ships.
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Type check
        run: npm run check
        working-directory: frontend
      - name: Unit tests
        run: npm test
        working-directory: frontend
      - name: Audit production dependencies
        run: npm audit --omit=dev
        working-directory: frontend
      - name: Build production container without credentials
        run: docker build -t frontend:ci frontend
      - name: Check container health as a non-root user
        run: |
          docker run --detach --name frontend-ci -p 127.0.0.1:3000:3000 frontend:ci
          trap 'docker logs frontend-ci; docker rm -f frontend-ci' EXIT
          test "$(docker exec frontend-ci id -u)" != "0"
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/health; then exit 0; fi
            sleep 1
          done
          exit 1
