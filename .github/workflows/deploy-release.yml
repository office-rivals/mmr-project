name: Deploy Release

# Deploys the image publish-github-releases.yml pushed to GHCR for a release, so
# what runs is the artifact that was released rather than a fresh build of it.
on:
  workflow_dispatch:
    inputs:
      component:
        description: Component to deploy
        required: true
        type: choice
        options:
          - frontend
          - frontend-beta
          - api
          - mmr-api
      version:
        description: Released version to deploy (MAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.component }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPONENT: ${{ inputs.component }}
      VERSION: ${{ inputs.version }}
    steps:
      # The version reaches a release tag, an image reference and GITHUB_ENV.
      - name: Validate the version
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be MAJOR.MINOR.PATCH, got: $VERSION" >&2
            exit 1
          fi

      - name: Verify release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "$COMPONENT@$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null

      # Mirrors buildImagePlan in scripts/release/create-releases.mjs. The
      # packages are public, so neither this check nor Azure's pull needs
      # registry credentials.
      - name: Verify the released image exists
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/$COMPONENT:$VERSION"
          digest="$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "DIGEST=$digest" >> "$GITHUB_ENV"

      - name: Resolve the Container App
        env:
          UI_APP: ${{ secrets.UI_CONTAINER_APP_NAME }}
          BETA_UI_APP: ${{ secrets.BETA_UI_CONTAINER_APP_NAME }}
          API_APP: ${{ secrets.API_CONTAINER_APP_NAME }}
          MMR_API_APP: ${{ secrets.MMR_API_CONTAINER_APP_NAME }}
        run: |
          case "$COMPONENT" in
            frontend) app="$UI_APP" ;;
            frontend-beta) app="$BETA_UI_APP" ;;
            api) app="$API_APP" ;;
            mmr-api) app="$MMR_API_APP" ;;
          esac
          if [ -z "$app" ]; then
            echo "No Container App is configured for $COMPONENT." >&2
            exit 1
          fi
          # A beta release must never replace the stable frontend.
          if [ "$COMPONENT" = "frontend-beta" ] && [ "$app" = "$UI_APP" ]; then
            echo "BETA_UI_CONTAINER_APP_NAME must name a separate Container App." >&2
            exit 1
          fi
          echo "CONTAINER_APP=$app" >> "$GITHUB_ENV"

      - name: Log in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy the image
        env:
          RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
        run: |
          revision="$(az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE" \
            --query properties.latestRevisionName \
            --output tsv)"
          echo "REVISION=$revision" >> "$GITHUB_ENV"

      # The update returns once the revision is provisioned, not once it serves.
      # In single-revision mode the previous revision keeps traffic until the new
      # one is ready, so an image that cannot start fails here, not in production.
      - name: Wait for the revision to become ready
        env:
          RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
        run: |
          for _ in $(seq 60); do
            ready="$(az containerapp show \
              --name "$CONTAINER_APP" \
              --resource-group "$RESOURCE_GROUP" \
              --query properties.latestReadyRevisionName \
              --output tsv)"
            if [ "$ready" = "$REVISION" ]; then
              exit 0
            fi
            state="$(az containerapp revision show \
              --name "$CONTAINER_APP" \
              --resource-group "$RESOURCE_GROUP" \
              --revision "$REVISION" \
              --query properties.runningState \
              --output tsv)"
            if [ "$state" = "Failed" ]; then
              break
            fi
            sleep 10
          done
          az containerapp revision show \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --revision "$REVISION" \
            --query '{provisioning: properties.provisioningState, running: properties.runningState, health: properties.healthState}' \
            --output table
          echo "Revision $REVISION did not become ready." >&2
          exit 1

      - name: Record the deployment
        run: |
          {
            echo "### Deployed $COMPONENT $VERSION"
            echo
            echo "- Image: \`$IMAGE\`"
            echo "- Digest: \`$DIGEST\`"
            echo "- Revision: \`$REVISION\`"
          } >> "$GITHUB_STEP_SUMMARY"
