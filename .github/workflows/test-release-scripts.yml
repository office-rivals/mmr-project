name: Release scripts - test

# The release scripts own version bumps, changelog generation and the image
# build plan, and their test suite was never wired into CI.
#
# Pull requests always run this workflow so its check reports and can be
# required; the `changes` job decides whether the suite runs.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - scripts/release/**
      - .nvmrc
      - .github/workflows/test-release-scripts.yml

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=true
          # Pushes are already scoped by `paths`.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # --no-renames also lists a moved file's old path, and -z stops git
            # quoting unusual names, which the anchors would then miss.
            files="$RUNNER_TEMP/changed-files"
            git diff --name-only -z --no-renames "$BASE_SHA"..."$HEAD_SHA" > "$files"
            # Only "no match" may skip the suite; a grep error must not.
            rc=0
            grep -qzE '^(scripts/release/|\.nvmrc$|\.github/workflows/test-release-scripts\.yml$)' "$files" || rc=$?
            if [ "$rc" -eq 1 ]; then changed=false; fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  test:
    name: Release scripts
    needs: changes
    # A skipped job passes as a required check, so only an explicit "nothing
    # changed" may skip the suite; a failed detection still runs it.
    if: ${{ !cancelled() && needs.changes.outputs.changed != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Run tests
        run: node --test scripts/release/*.test.mjs
