name: Beta UI - build and test

# Pull requests always run this workflow so its check reports and can be
# required; the `changes` job decides whether the suite runs. The frontend's
# manifests count because the type check uses its Playwright install.
on:
  push:
    branches: [main]
    paths:
      - 'frontend-beta/**'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/test-beta.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=true
          # Pushes are already scoped by `paths`.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            files="$(git diff --name-only "$BASE_SHA"..."$HEAD_SHA")"
            grep -qE '^(frontend-beta/|frontend/package(-lock)?\.json$|\.github/workflows/test-beta\.yml$)' <<< "$files" || changed=false
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  build:
    name: Beta UI
    needs: changes
    # A skipped job passes as a required check, so only an explicit "nothing
    # changed" may skip the suite; a failed detection still runs it.
    if: ${{ !cancelled() && needs.changes.outputs.changed != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # The beta pins its own Node major so CI tests the runtime its image ships.
          node-version-file: frontend-beta/.nvmrc
          cache: npm
          cache-dependency-path: |
            frontend-beta/package-lock.json
            frontend/package-lock.json
      - name: Install shared browser test types
        run: npm ci
        working-directory: frontend
      - name: Install
        run: npm ci
        working-directory: frontend-beta
      - name: Type check
        run: npm run check
        working-directory: frontend-beta
      - name: Unit tests
        run: npm test
        working-directory: frontend-beta
      - name: Audit production dependencies
        run: npm audit --omit=dev
        working-directory: frontend-beta
      - name: Build production container without credentials
        run: docker build -t frontend-beta:ci frontend-beta
      - name: Check container health as a non-root user
        run: |
          docker run --detach --name beta-ci -p 127.0.0.1:3000:3000 frontend-beta:ci
          trap 'docker logs beta-ci; docker rm -f beta-ci' EXIT
          test "$(docker exec beta-ci id -u)" != "0"
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/health; then exit 0; fi
            sleep 1
          done
          exit 1
