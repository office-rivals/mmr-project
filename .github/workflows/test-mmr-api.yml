# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go - build and test (codecov)

# Pull requests always run this workflow so its check reports and can be
# required; the `changes` job decides whether the suite runs.
on:
  push:
    branches: ["main"]
    paths:
      - "mmr-api/**/*"
      - ".github/workflows/test-mmr-api.yml"
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=true
          # Pushes are already scoped by `paths`.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            files="$(git diff --name-only "$BASE_SHA"..."$HEAD_SHA")"
            grep -qE '^(mmr-api/|\.github/workflows/test-mmr-api\.yml$)' <<< "$files" || changed=false
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  build:
    name: MMR API
    needs: changes
    # A skipped job passes as a required check, so only an explicit "nothing
    # changed" may skip the suite; a failed detection still runs it.
    if: ${{ !cancelled() && needs.changes.outputs.changed != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: mmr-api/go.mod
          cache-dependency-path: mmr-api/go.sum

      - name: Build
        working-directory: ./mmr-api
        run: go build -v ./...

      - name: Test
        working-directory: ./mmr-api
        run: go test -v ./... -race -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
