version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/mmr-api"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      opentelemetry:
        patterns:
          - "go.opentelemetry.io/*"
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      # bits-ui 2 stops selecting an auto-focused field's value, so typing a
      # new score appends to the old one. The SvelteKit app is being replaced
      # by frontend-beta, so it stays on 1.x rather than adapting.
      - dependency-name: "bits-ui"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "docker"
    directory: "/frontend-beta"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "npm"
    directory: "/frontend-beta"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "nuget"
    directory: "/api"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
