        (function () {
          // Every time below is film time: scene start + a cue from tools/retime.py, so each visual lands with,
          // or 0.3 s before, the narrated word it shows. Behaviour follows ux/SCOREBOARD-UI.md (screens, LEDs,
          // target light, refresh rules); the buzzer sounds are in the audio track (tools/sound.py).
          const F = window.__FILM;
          const T = F.t;
          const at = (s, k) => F.scenes[s][0] + F.cues[s][k];
          const S0 = (s) => F.scenes[s][0];
          const tl = gsap.timeline({ paused: true });
          const $ = (id) => document.getElementById(id);

          // fixed texts
          $("t-badge").textContent = T.badge;
          $("admin-head").textContent = T.admin_head.toUpperCase();
          $("admin-label").textContent = T.admin_label;
          $("ph-title").textContent = T.ph_title;
          $("ph-mine").textContent = T.ph_mine;
          $("ph-other").textContent = T.ph_other;
          $("ph-eve").textContent = T.ph_eve;
          $("ph-btn").textContent = T.ph_link;
          $("combo-text").textContent = T.combo;
          $("months-label").textContent = T.months;
          const hl = document.createElement("div");
          hl.id = "seg-hl";
          $("seg").appendChild(hl);
          T.levels.forEach((w, i) => {
            const el = document.createElement("div");
            el.className = "seg";
            el.id = "seg" + i;
            el.style.left = i * 175.5 + "px";
            el.textContent = w;
            $("seg").appendChild(el);
          });

          // LEDs (6 player colours + white feedback) and the target light, one layer per colour
          const COL = { white: "#ffffff", blue: "#3d7bff", yellow: "#ffd23f", green: "#3ddc6a", magenta: "#ff3fd2", cyan: "#3fe0ff" };
          const SEG = [[0, 129.7], [129.7, 254.5], [254.5, 379.3], [379.3, 509]];   // bar x; baffles at the key boundaries
          SEG.forEach(([x0, x1], i) => {
            const kx = 67.3 + i * 124.8 - x0;   // the key's centre inside its segment
            for (const c in COL) {
              const el = document.createElement("div");
              el.className = "ledseg";
              el.id = `led${i}-${c}`;
              el.style.left = x0 + "px";
              el.style.width = x1 - x0 + "px";
              el.style.background = `radial-gradient(ellipse 70px 30px at ${kx}px 50%, #ffffff 0%, ${COL[c]} 32%, ${COL[c]}bb 70%, ${COL[c]}66 100%)`;
              $("strip").appendChild(el);
            }
          });
          for (const c of [...Object.keys(COL), "pulse"]) {
            const el = document.createElement("div");
            el.className = "glow";
            el.id = "glow-" + c;
            const col = c === "pulse" ? "#ffffff" : COL[c];
            el.style.background = `radial-gradient(closest-side, ${col} 0%, ${col}cc 45%, ${col}00 100%)`;
            $("glows").appendChild(el);
          }

          const AWAY = { x: 1150, y: 300, scale: 1.5, rotation: 12 };   // the badge card, off frame (front right)
          const NEAR = { x: 40, y: 18, scale: 1.12, rotation: -4 };    // just in front of the target
          const ON = { x: 0, y: 0, scale: 1, rotation: 0 };            // pressed on the target (right wing)
          // ---- helpers (call in film order: they track what is lit / shown) ----
          let cur = null;
          function show(t, name, full) {
            const next = $("scr-" + name);
            if (!full) {
              tl.to(next, { opacity: 1, duration: 0.12, ease: "none" }, t);
              if (cur) tl.to(cur, { opacity: 0, duration: 0.12, ease: "none" }, t);
            } else {   // e-paper full refresh: black / white / black, then the new image
              tl.set("#flash", { opacity: 1, backgroundColor: "#15171b" }, t);
              tl.set("#flash", { backgroundColor: "#f4f2ec" }, t + 0.14);
              tl.set("#flash", { backgroundColor: "#15171b" }, t + 0.27);
              tl.set(next, { opacity: 1 }, t + 0.27);
              if (cur) tl.set(cur, { opacity: 0 }, t + 0.27);
              tl.set("#flash", { opacity: 0 }, t + 0.4);
            }
            cur = next;
          }
          const led = [null, null, null, null];
          function setLed(t, i, c) {
            if (led[i] === c) return;
            if (led[i]) tl.to(`#led${i}-${led[i]}`, { opacity: 0, duration: 0.08, ease: "none" }, t);
            if (c) tl.to(`#led${i}-${c}`, { opacity: 1, duration: 0.08, ease: "none" }, t);
            led[i] = c;
          }
          const setLeds = (t, cs) => cs.forEach((c, i) => setLed(t, i, c));
          function blink(t, idx, cs, n, period) {   // e.g. goal: scoring side, twice
            const keep = idx.map((i) => led[i]);
            for (let k = 0; k < n; k++) {
              idx.forEach((i, j) => setLed(t + k * period, i, cs[j]));
              idx.forEach((i) => setLed(t + k * period + period / 2, i, null));
            }
            idx.forEach((i, j) => setLed(t + n * period, i, keep[j]));
          }
          function press(t, i, opts = {}) {   // switch click is in the audio; label inverts; LED white 0.2 s
            tl.to("#k" + i, { y: 11, duration: 0.06, ease: "power2.in" }, t);
            tl.to("#k" + i, { y: 0, duration: 0.14, ease: "power2.out" }, t + 0.14);
            if (opts.led !== false) {
              const was = led[i];
              setLed(t + 0.04, i, "white");
              setLed(t + 0.24, i, was);
            }
            if (opts.inv !== false) {
              tl.set("#inv" + i, { opacity: 1 }, t + 0.04);
              tl.set("#inv" + i, { opacity: 0 }, t + 0.35);
            }
          }
          const glowEvents = [];
          function glow(t, c, dur, level = 1) {
            glowEvents.push([t, t + dur]);
            tl.to("#glow-" + c, { opacity: level, duration: 0.08, ease: "none" }, t);
            tl.to("#glow-" + c, { opacity: 0, duration: 0.2, ease: "none" }, t + dur);
          }
          const listening = [];   // [from, to]: the soft "you can scan now" blink every 3 s
          function card(enter, touch, lift) {
            tl.fromTo("#card", AWAY, { ...NEAR, duration: 0.4, ease: "power3.out", immediateRender: false }, enter);
            tl.to("#card", { ...ON, duration: 0.16, ease: "power2.in" }, touch - 0.16);
            tl.to("#card", { ...AWAY, duration: 0.4, ease: "power2.in" }, lift);
          }
          // initial states outside the timeline (a set at 0 doesn't render while the playhead sits at 0)
          gsap.set("#rig-pos", { scale: 0.92, transformOrigin: "50% 0%" });
          gsap.set("#card", AWAY);
          gsap.set("#phone", { y: 900 });
          gsap.set(["#admin", "#combo"], { x: 1000 });
          gsap.set(["#cells", "#months"], { autoAlpha: 0 });   // hidden, not just transparent, until s7

          // ---- s1: asleep, wake ----
          show(0, "idle", false);
          tl.fromTo("#rig-pos", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.9, ease: "power3.out" }, 0);
          const key = at("s1", "key"), bump = at("s1", "bump"), wake = at("s1", "wake");
          press(key, 2, { led: false, inv: false });   // a key in Idle only wakes the board
          show(key + 0.3, "waking");
          tl.to("#rig", { keyframes: [{ x: -14, rotation: -0.6, duration: 0.05 }, { x: 10, rotation: 0.4, duration: 0.06 }, { x: -6, rotation: -0.2, duration: 0.06 }, { x: 0, rotation: 0, duration: 0.1 }] }, bump);
          show(wake, "lobby");
          listening.push([wake + 0.5, at("s3", "play")]);

          // ---- s2: badges, teams ----
          const blip = at("s2", "blip"), joined = at("s2", "joined");
          card(at("s2", "tap"), blip - 0.25, joined - 0.3);
          glow(blip - 0.25, "white", joined - 0.3 - (blip - 0.25));
          show(joined, "bob-joined");
          glow(joined, "yellow", 1.0);
          setLeds(joined, ["blue", "yellow", null, null]);   // Alice (joined earlier) and Bob, above their slots
          const allin = at("s2", "allin");
          // Carol, then Dave (one card stands in for both): each tap >= 0.3 s, each join after the release
          tl.fromTo("#card", AWAY, { ...NEAR, duration: 0.35, ease: "power3.out", immediateRender: false }, allin - 2.75);
          tl.to("#card", { ...ON, duration: 0.16, ease: "power2.in" }, allin - 2.36);
          glow(allin - 2.2, "white", 0.35);
          tl.to("#card", { ...NEAR, duration: 0.2, ease: "power2.out" }, allin - 1.85);
          show(allin - 1.5, "carol-joined");
          glow(allin - 1.5, "green", 0.45);
          setLed(allin - 1.5, 2, "green");
          tl.to("#card", { ...ON, duration: 0.16, ease: "power2.in" }, allin - 1.16);
          glow(allin - 1.0, "white", 0.4);
          tl.to("#card", { ...AWAY, duration: 0.4, ease: "power2.in" }, allin - 0.6);
          show(allin, "dave-joined");
          glow(allin, "magenta", 1.0);
          setLed(allin, 3, "magenta");
          // the three ways to make teams (ux 18d): each mode key's label lights in turn, then K4 Fair is pressed
          function modeKey(t0, t1, i) {
            const was = led[i];
            setLed(t0, i, "white");
            setLed(t1, i, was);
            tl.set("#inv" + i, { opacity: 1 }, t0);
            tl.set("#inv" + i, { opacity: 0 }, t1);
          }
          const make = at("s2", "make");
          modeKey(at("s2", "choose"), at("s2", "random"), 1);
          modeKey(at("s2", "random"), at("s2", "fair"), 2);
          modeKey(at("s2", "fair"), make, 3);
          press(make, 3);
          show(make + 0.35, "teams-made");
          setLeds(make + 0.35, ["green", "magenta", "blue", "yellow"]);   // left team K1-K2, right K3-K4
          const swap = at("s2", "swap");
          press(swap, 1);
          show(swap + 0.35, "teams");
          setLeds(swap + 0.35, ["blue", "yellow", "green", "magenta"]);

          // ---- s3: goals, who scored, undo ----
          const play = at("s3", "play");
          setLeds(play, [null, null, null, null]);
          show(play, "live-7-5", true);   // full refresh at the start of a game
          const goal = at("s3", "goal");
          show(goal, "goal");
          blink(goal, [0, 1], ["blue", "yellow"], 2, 0.5);
          const own = at("s3", "own");
          press(own, 2);
          show(own + 0.35, "own-goal");
          const undo = at("s3", "undo");
          show(undo - 0.75, "live-8-5");
          press(undo, 0);
          show(undo + 0.35, "undo");
          const down = at("s3", "down");
          press(down, 3);
          show(down + 0.5, "live-7-5");

          // ---- s4: won, auto-save, rematch ----
          show(S0("s4") - 0.05, "live-9-7");
          const won = at("s4", "won");
          blink(won, [0, 1], ["blue", "yellow"], 4, 0.25);
          show(won + 0.9, "saving-8");
          const count = at("s4", "count");
          show(count, "saving-6");
          show(count + 0.45, "saving-4");
          show(count + 0.9, "saving-2");
          show(at("s4", "saved"), "saved");
          const rematch = at("s4", "rematch");
          press(rematch, 3);
          show(rematch + 0.35, "teams");
          setLeds(rematch + 0.35, ["blue", "yellow", "green", "magenta"]);
          listening.push([won + 1.6, S0("s5") - 0.3]);   // Finished (first 60 s) and Teams

          // ---- s5: unknown badge, link with the phone ----
          setLeds(S0("s5") - 0.05, [null, null, null, null]);
          show(S0("s5") - 0.05, "lobby-ab");
          const unk = at("s5", "unknown");
          card(unk - 0.1, unk + 0.55, unk + 0.85);
          glow(unk + 0.55, "white", 0.3);
          glowEvents.push([unk + 0.85, unk + 2.15]);   // unknown: target off for 1 s after the answer
          show(unk + 1.15, "unknown");
          const link = at("s5", "link");
          tl.fromTo("#phone", { y: 900 }, { y: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, link);
          const mate = at("s5", "mate"), inn = at("s5", "in");
          tl.to("#ph-who", { opacity: 1, duration: 0.15, ease: "none" }, mate);
          tl.to("#ph-scan", { opacity: 0, duration: 0.15, ease: "none" }, mate);
          const tap = (el, t) => {
            tl.to(el, { scale: 0.94, duration: 0.07, ease: "power2.in" }, t);
            tl.to(el, { scale: 1, duration: 0.12, ease: "power2.out" }, t + 0.08);
          };
          tap("#ph-other", mate + 0.45);
          tl.to("#ph-other", { backgroundColor: "#1b1d22", color: "#f2efe8", duration: 0.1, ease: "none" }, mate + 0.5);
          tl.to("#ph-eve", { opacity: 1, duration: 0.15, ease: "none" }, mate + 0.75);
          tap("#ph-eve", mate + 1.1);
          tl.to("#ph-eve", { backgroundColor: "#e7e2d7", duration: 0.1, ease: "none" }, mate + 1.15);
          tl.to("#ph-btn", { opacity: 1, duration: 0.15, ease: "none" }, inn);
          tap("#ph-btn", inn + 0.5);
          show(inn + 0.9, "eve-in");
          setLeds(inn + 0.9, ["blue", "yellow", "cyan", null]);
          tl.to("#phone", { y: 900, duration: 0.5, ease: "power2.in" }, inn + 2.0);
          listening.push([S0("s5") + 0.3, at("s7", "flat")]);

          // ---- s6: volume in admin, no combo ----
          const admin = at("s6", "admin");
          tl.to("#rig-pos", { x: -400, scale: 0.8, duration: 0.6, ease: "power3.inOut" }, admin - 0.3);
          tl.to("#admin", { x: 0, duration: 0.5, ease: "power3.out" }, admin);
          const lv = (t, i) => {   // the selection pill moves; the chosen word turns paper-coloured
            tl.to("#seg-hl", { x: i * 175.5, duration: 0.12, ease: "power2.out" }, t);
            [0, 1, 2, 3].forEach((j) => tl.to("#seg" + j, { color: j === i ? "#f2efe8" : "#1b1d22", duration: 0.1, ease: "none" }, t));
          };
          lv(admin, 2);   // default Medium
          ["off", "low", "med", "high"].forEach((k, i) => lv(at("s6", k), i));
          lv(at("s6", "high") + 0.7, 2);
          const combo = at("s6", "combo");
          tl.to("#combo", { x: 0, duration: 0.4, ease: "power3.out" }, combo);
          ["#x1", "#x2", "#x3"].forEach((x, i) => {
            tl.set(x, { opacity: 1 }, combo + 0.4 + i * 0.12);
            tl.fromTo(x, { strokeDasharray: 800, strokeDashoffset: 800 }, { strokeDashoffset: 0, duration: 0.18, ease: "power2.in", immediateRender: true }, combo + 0.4 + i * 0.12);
          });
          setLeds(inn + 0.9 + 10, [null, null, null, null]);   // steady lobby light times out after 10 s

          // ---- s7: batteries, flat, close ----
          const s7 = S0("s7");
          tl.to(["#admin", "#combo"], { x: 1000, duration: 0.45, ease: "power2.in" }, s7 - 0.3);
          tl.to("#rig-pos", { x: -340, scale: 0.8, duration: 0.5, ease: "power2.inOut" }, s7 - 0.1);
          tl.set(["#cells", "#months"], { autoAlpha: 1 }, s7);
          const b11 = at("s7", "b11");
          ["#c1", "#c2", "#c3"].forEach((c, i) => {
            tl.fromTo(c, { opacity: 0, y: -140 }, { opacity: 1, y: 0, duration: 0.4, ease: "bounce.out", immediateRender: true }, b11 + i * 0.15);
          });
          tl.fromTo(["#bar", "#months-label", ".tick"], { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "none", immediateRender: true }, b11 + 0.5);
          tl.fromTo("#bar-fill", { scaleX: 0, svgOrigin: "1156 605" }, { scaleX: 1, duration: 1.1, ease: "power2.out", immediateRender: true }, at("s7", "months"));   // 2.3 months, then the range to 3.3 (INTERFACES §0, scoreboard, speaker; EST)
          tl.fromTo("#bar-range", { opacity: 0 }, { opacity: 0.35, duration: 0.4, ease: "none", immediateRender: true }, at("s7", "months") + 1.1);
          const flat = at("s7", "flat");
          tl.to("#cells-flat", { opacity: 1, duration: 0.3, ease: "none" }, flat);
          show(flat, "flat", true);
          const b12 = at("s7", "b12");
          tl.to("#cells-flat", { opacity: 0, duration: 0.25, ease: "none" }, b12 - 1.1);
          ["#c1", "#c2", "#c3"].forEach((c, i) => tl.fromTo(c, { y: -30 }, { y: 0, duration: 0.3, ease: "bounce.out", immediateRender: false }, b12 - 1.1 + i * 0.08));
          show(b12 - 0.6, "lobby", true);   // fresh cells: one full refresh to what the server says
          tl.to(["#cells", "#months"], { autoAlpha: 0, duration: 0.4, ease: "none" }, b12 - 0.2);
          tl.to("#rig-pos", { x: 0, scale: 0.92, duration: 0.8, ease: "power3.inOut" }, b12 - 0.2);
          listening.push([b12 + 0.6, F.total - 0.3]);

          // the target's listening blink: every 3 s, never on top of a touch / join / "off for 1 s"
          listening.forEach(([a, b]) => {
            for (let t = a; t + 0.6 < b; t += 3) {
              if (glowEvents.some(([g0, g1]) => t + 0.6 > g0 - 0.2 && t < g1 + 0.3)) continue;
              tl.fromTo("#glow-pulse", { opacity: 0 }, { opacity: 0.45, duration: 0.3, ease: "sine.inOut", immediateRender: false }, t);
              tl.to("#glow-pulse", { opacity: 0, duration: 0.3, ease: "sine.inOut" }, t + 0.3);
            }
          });

          window.__timelines["board"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
