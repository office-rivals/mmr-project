<!doctype html>
<html lang="__LANG__">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Scoreboard</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/theme.css" />
    <!-- Per-language data (strings, captions, cue times), written by tools/retime.py -->
    <script src="assets/i18n/__LANG__.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f2efe8;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f2efe8;
      }
      #bg-grid {
        position: absolute;
        inset: -80px;
        background-image:
          linear-gradient(rgba(27, 29, 34, 0.07) 2px, transparent 2px),
          linear-gradient(90deg, rgba(27, 29, 34, 0.07) 2px, transparent 2px);
        background-size: 80px 80px;
      }
      #bg-glow {
        position: absolute;
        width: 1400px;
        height: 1400px;
        right: -400px;
        top: -500px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(232, 67, 31, 0.16), rgba(232, 67, 31, 0) 65%);
      }
      .wipe {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background: #e8431f;
      }
      .scene-host {
        position: absolute;
        inset: 0;
      }
      /* The one line on screen. */
      .cap {
        position: absolute;
        left: 120px;
        bottom: 150px;
        width: 1680px;
        font-family: "Archivo Black", "Arial Black", sans-serif;
        font-size: 92px;
        line-height: 1.05;
        letter-spacing: -0.03em;
        color: #1b1d22;
        white-space: nowrap;
      }
      .cap em {
        font-style: normal;
        color: #e8431f;
      }
      /* Subtitles of the narration (one line, always below the headline band, never over a diagram). */
      .sub {
        position: absolute;
        left: 120px;
        bottom: 34px;
        padding: 8px 22px 10px;
        border-radius: 10px;
        background: #1b1d22;
        color: #f2efe8;
        font-family: "IBM Plex Mono", monospace;
        font-weight: 600;
        font-size: 44px;
        line-height: 1.25;
        white-space: nowrap;
        opacity: 0;
      }
      /* Quiet context chrome on every scene: corner mark + hairline. Never animated. */
      #chrome-mark {
        position: absolute;
        left: 120px;
        top: 46px;
        font-family: "IBM Plex Mono", monospace;
        font-weight: 700;
        font-size: 20px;
        letter-spacing: 0.16em;
        color: #55585f;
      }
      #chrome-rule {
        position: absolute;
        left: 120px;
        right: 120px;
        bottom: 56px;
        height: 2px;
        background: rgba(27, 29, 34, 0.22);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="__TOTAL__" data-width="1920" data-height="1080">
      <div id="bg" class="clip" data-start="0" data-duration="__TOTAL__" data-track-index="0">
        <div id="bg-grid"></div>
        <div id="bg-glow"></div>
      </div>

      <!-- One board for the whole film: its state changes are the story. Cue times per scene (s1-s7) come from
           window.__FILM (tools/retime.py), so the board composition reads scene start + cue. -->
      <div id="board" class="scene-host" data-composition-id="board" data-composition-src="compositions/board.html"
        data-start="0" data-duration="__TOTAL__" data-track-index="1" data-width="1920" data-height="1080"></div>
      <!-- Audio (generated by tools/vo.py + tools/sound.py; see AUDIO-CREDITS.md) -->
      <audio id="audio-vo" src="assets/audio/__LANG__/vo.wav" data-start="0" data-duration="__TOTAL__" data-track-index="5" data-volume="1"></audio>
      <audio id="audio-sfx" src="assets/audio/__LANG__/sfx.wav" data-start="0" data-duration="__TOTAL__" data-track-index="6" data-volume="1"></audio>
      <audio id="audio-music" src="assets/audio/__LANG__/music.wav" data-start="0" data-duration="__TOTAL__" data-track-index="7" data-volume="1"></audio>

      <div id="chrome" class="clip" data-start="0" data-duration="__TOTAL__" data-track-index="4">
        <div id="chrome-mark">__CHROME__</div>
        <div id="chrome-rule"></div>
      </div>

      <div id="caps" class="clip" data-start="0" data-duration="__TOTAL__" data-track-index="2"></div>

      <div id="wipes" class="clip" data-start="0" data-duration="__TOTAL__" data-track-index="3">
        <div class="wipe" id="w1"></div>
        <div class="wipe" id="w2"></div>
      </div>
    </div>
    <script>
      const F = window.__FILM;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#bg-grid", { x: 0, y: 0 }, { x: -80, y: -40, duration: F.total, ease: "none" }, 0);
      tl.fromTo("#bg-glow", { scale: 0.9, opacity: 0.8 }, { scale: 1.1, opacity: 1, duration: 14, ease: "sine.inOut", yoyo: true, repeat: Math.max(0, Math.floor(F.total / 14) - 1) }, 0);

      // Captions: [in, out, html] in film time. One line at a time; each lands with (or just before)
      // the narration it belongs to (tools/retime.py places them from the VO word timings).
      const host = document.getElementById("caps");
      F.caps.forEach(([a, b, text], i) => {
        const el = document.createElement("div");
        el.className = "cap";
        el.id = "cap" + i;
        el.innerHTML = text;
        host.appendChild(el);
        tl.fromTo(el, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, a);
        if (b < F.total - 0.1) tl.to(el, { opacity: 0, duration: 0.2, ease: "power1.in" }, b - 0.2);
      });

      // Subtitles: [in, out, text] from the VO word timings (tools/retime.py). Phrases an on-screen line
      // already says are left out there.
      F.subs.forEach(([a, b, text], i) => {
        const el = document.createElement("div");
        el.className = "sub";
        el.id = "sub" + i;
        el.textContent = text;
        host.appendChild(el);
        tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, a);
        tl.to(el, { opacity: 0, duration: 0.12, ease: "none" }, b - 0.12);
      });

      // Accent wipes where time jumps (a later game, a new lobby).
      ["s4", "s5"].forEach((s, i) => {
        const t = F.scenes[s][0];
        const id = "#w" + (i + 1);
        tl.set(id, { scaleX: 0, transformOrigin: "left center" }, 0);
        tl.fromTo(id, { scaleX: 0 }, { scaleX: 1, duration: 0.22, ease: "power3.in", immediateRender: false }, t - 0.22);
        tl.set(id, { transformOrigin: "right center" }, t);
        tl.to(id, { scaleX: 0, duration: 0.28, ease: "power3.out" }, t);
      });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
