          const flowEl = document.getElementById("p-flow");
          const els = P.map(([s, k, html, hl]) => {
            const el = html === "FLOW" ? flowEl : make(html);
            return { s, k, el, hl, a: at(s, k) };
          });
          els.forEach((p, i) => {
            const next = els[i + 1];
            const sEnd = F.scenes[p.s][0] + F.scenes[p.s][1];
            const b = next && next.s === p.s ? next.a : sEnd;
            // a crossfade: the next panel starts coming in as this one goes (no empty frame between them)
            tl.fromTo(p.el, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, p.a - 0.15);
            tl.to(p.el, { opacity: 0, duration: 0.2 }, b - 0.15);
            (p.hl || []).forEach(([cue, from, to]) => {
              const lines = [...p.el.querySelectorAll(".ln")].filter((l) => +l.dataset.i >= from && +l.dataset.i <= to);
              tl.set(lines, { backgroundColor: "rgba(232, 67, 31, 0.24)", borderLeftColor: "#e8431f" }, at(p.s, cue));
            });
          });

          // ---- s2: the flow, step by step on the narration ----
          const s2 = (k) => at("s2", k);
          gsap.set(["#n-fw", "#n-api", "#n-db", "#n-phone", "#e1", "#e2", "#e3", "#e4", "#l2", "#l4", "#pk", "#undo-dev"], { opacity: 0 });
          const step = (sel, t) => tl.to(sel, { opacity: 1, duration: 0.3 }, t);
          step(["#e1", "#n-fw"], s2("fw"));
          step(["#e2", "#l2", "#n-api"], s2("post"));
          step(["#e3", "#n-db"], s2("db"));
          step(["#e4", "#l4", "#n-phone"], s2("notify"));
          const hop = (x0, y0, x1, y1, t, d) => tl.fromTo("#pk", { attr: { cx: x0, cy: y0 }, opacity: 1 }, { attr: { cx: x1, cy: y1 }, duration: d, ease: "power1.inOut", immediateRender: false }, t);
          hop(125, 155, 500, 155, s2("beam") + 0.1, 0.5);
          hop(500, 155, 935, 155, s2("post"), 0.6);
          hop(935, 155, 935, 475, s2("db"), 0.5);
          hop(935, 475, 1450, 315, s2("notify"), 0.7);
          tl.to("#pk", { opacity: 0, duration: 0.3 }, s2("phone") + 0.6);
          step("#undo-dev", s2("devundo"));

          // ---- s7: the review notes, one by one ----
          const notes = els.find((p) => p.s === "s7").el.querySelector(".list");
          [["sb", "The scoreboard is parked, not removed<br><small>still in the API (device long-poll, actions, cards) and the frontend (My badges, Scoreboard role)</small>"],
           ["chg", "Two changesets mention it, and run long<br><small>.changeset/foosball-table-hardware.md · foosball-tables.md: should be one or two sentences each</small>"],
           ["poll", "The long-poll's 2 s fallback under load<br><small>TableMatchService.WaitForChangeAsync</small>"]].forEach(([k, html]) => {
            const it = document.createElement("div");
            it.className = "item";
            it.innerHTML = html;
            notes.appendChild(it);
            tl.fromTo(it, { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, at("s7", k));
          });

          window.__timelines["deck"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
