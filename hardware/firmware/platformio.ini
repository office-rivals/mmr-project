; Build:  uvx platformio@6.1.19 run        Flash: ... -t upload        Tests: uvx platformio@6.1.19 test -e native
; (6.1.19: 6.2.0 breaks pioarduino)
[platformio]
default_envs = xiao_c6

[env]
lib_deps = bblanchon/ArduinoJson@7.4.2

[env:xiao_c6]
; pioarduino = Arduino 3.x on ESP-IDF 5.5 (the official platform has no Arduino for C6)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
board_build.partitions = ${platformio.packages_dir}/framework-arduinoespressif32/tools/partitions/huge_app.csv  ; 3 MB app, no OTA; NVS at the default offset (a path: the IDF lib rebuild wants one)
; Auto light sleep while associated needs PM + tickless idle, which the prebuilt Arduino libs ship
; disabled: pioarduino rebuilds them from ESP-IDF (first build ~6 min).
custom_sdkconfig =
  CONFIG_PM_ENABLE=y
  CONFIG_FREERTOS_USE_TICKLESS_IDLE=y
  CONFIG_ULP_COPROC_ENABLED=y
  CONFIG_ULP_COPROC_TYPE_LP_CORE=y
  CONFIG_ULP_COPROC_RESERVE_MEM=4096
  CONFIG_ESP_BROWNOUT_DET_LVL_SEL_5=y
monitor_speed = 115200
build_flags = -DFW_VERSION=\"0.1.0\" -DARDUINO_USB_CDC_ON_BOOT=1 -Iinclude
build_src_filter = +<goal/>  ; src/lp is the LP core's (tools/lp_build.py)
lib_deps = ${env.lib_deps}
  olikraus/U8g2@2.36.5  ; BSD-2: the debug OLED (U8x8 text mode)
extra_scripts = post:tools/lp_build.py  ; the LP-core program (status LED in deep sleep)

[env:xiao_c6_bench]
; light sleep off: USB serial stays up and the LED follows the beam
extends = env:xiao_c6
build_flags = ${env:xiao_c6.build_flags} -DUSE_LIGHT_SLEEP=0

[env:xiao_c6_per_goal]
; fallback: Wi-Fi off between goals, reconnect per goal
extends = env:xiao_c6
build_flags = ${env:xiao_c6.build_flags} -DWIFI_PER_GOAL=1

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++20
