    <div class="rail">
      <div class="ticks" id="ticks"></div>
      <div class="railmeta">
        <span id="clock">00:00</span>
        <span id="counter">01 / 22</span>
        <span class="amp">mmr-project</span>
      </div>
    </div>
  </div>
</div>

<aside id="notes">
  <h3>Speaker notes</h3>
  <div class="nt" id="noteBody"></div>
  <div class="meta" id="noteMeta"></div>
</aside>

<div id="overview"></div>

<div id="help">← → move · <b>N</b> notes · <b>O</b> overview · <b>F</b> full screen · <b>T</b> timer</div>

<script>
(function(){
  var slides = [].slice.call(document.querySelectorAll('.slide'));
  var stage = document.getElementById('stage');
  var ticks = document.getElementById('ticks');
  var counter = document.getElementById('counter');
  var clock = document.getElementById('clock');
  var notes = document.getElementById('notes');
  var noteBody = document.getElementById('noteBody');
  var noteMeta = document.getElementById('noteMeta');
  var overview = document.getElementById('overview');
  var cur = 0, t0 = null, timerOn = false, timerTouched = false, autoStarted = false;

  slides.forEach(function(s, i){
    var b = document.createElement('div');
    b.className = 'tick';
    b.addEventListener('click', function(){ go(i); });
    ticks.appendChild(b);

    var btn = document.createElement('button');
    var h = s.querySelector('h1, h2');
    btn.innerHTML = '<span class="on">' + String(i+1).padStart(2,'0') + '</span><span class="ot"></span>';
    btn.querySelector('.ot').textContent = h ? h.textContent : 'Slide';
    btn.addEventListener('click', function(){ go(i); toggleOverview(false); });
    overview.appendChild(btn);
  });
  var tickEls = [].slice.call(ticks.children);
  var ovBtns = [].slice.call(overview.children);

  function fit(){
    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720) * 0.94;
    stage.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit); fit();

  function go(i){
    if (i < 0 || i >= slides.length) return;
    var from = cur;
    slides[cur].classList.remove('on');
    cur = i;
    // leaving the title slide starts the clock, unless the presenter already used T
    if (from === 0 && cur === 1 && !timerOn && !timerTouched && !autoStarted) {
      timerOn = true; t0 = Date.now(); autoStarted = true;
    }
    var s = slides[cur];
    s.classList.remove('on');
    void s.offsetWidth;            // restart entrance animations
    s.classList.add('on');
    tickEls.forEach(function(t, n){
      t.className = 'tick' + (n === cur ? ' now' : (n < cur ? ' done' : ''));
    });
    ovBtns.forEach(function(b, n){ b.className = n === cur ? 'cur' : ''; });
    counter.textContent = String(cur+1).padStart(2,'0') + ' / ' + String(slides.length).padStart(2,'0');
    var tpl = s.querySelector('template.notes');
    noteBody.textContent = tpl ? tpl.innerHTML.trim() : '(no notes)';
    noteMeta.textContent = 'SLIDE ' + (cur+1) + ' · ' + (s.dataset.eyebrow || '').toUpperCase() +
                           ' · TARGET ' + (s.dataset.time || '—');
    if (location.hash !== '#' + (cur+1)) history.replaceState(null, '', '#' + (cur+1));
  }

  function toggleOverview(force){
    var open = typeof force === 'boolean' ? force : !overview.classList.contains('open');
    overview.classList.toggle('open', open);
  }

  function tick(){
    if (!timerOn || t0 === null) return;
    var e = Math.floor((Date.now() - t0) / 1000);
    clock.textContent = String(Math.floor(e/60)).padStart(2,'0') + ':' + String(e%60).padStart(2,'0');
    clock.classList.toggle('over', e > 10*60);
  }
  setInterval(tick, 1000);

  document.addEventListener('keydown', function(e){
    var k = e.key; if (e.target && e.target.tagName === 'VIDEO') return;
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ') { e.preventDefault(); go(cur+1); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); go(cur-1); }
    else if (k === 'Home') go(0);
    else if (k === 'End') go(slides.length-1);
    else if (k === 'n' || k === 'N') notes.classList.toggle('open');
    else if (k === 'o' || k === 'O') toggleOverview();
    else if (k === 'Escape') toggleOverview(false);
    else if (k === 'f' || k === 'F') {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
    }
    else if (k === 't' || k === 'T') {
      timerTouched = true;
      if (!timerOn) { timerOn = true; t0 = Date.now(); }
      else { timerOn = false; t0 = null; clock.textContent = '00:00'; clock.classList.remove('over'); }
    }
    else if (/^[0-9]$/.test(k)) { /* ignore */ }
  });

  var sx = null;
  document.addEventListener('touchstart', function(e){ sx = e.touches[0].clientX; }, {passive:true});
  document.addEventListener('touchend', function(e){
    if (sx === null) return;
    var dx = e.changedTouches[0].clientX - sx;
    if (Math.abs(dx) > 55) go(cur + (dx < 0 ? 1 : -1));
    sx = null;
  }, {passive:true});

  var start = parseInt((location.hash || '#1').slice(1), 10);
  go(isNaN(start) ? 0 : Math.min(Math.max(start-1, 0), slides.length-1));
})();
</script>

</body></html>
